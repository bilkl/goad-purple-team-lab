- name: Set the expected name before joining the member to the lab
  hosts: workstation
  gather_facts: false
  tasks:
    - name: Restore the scenario hostname after Sysprep
      ansible.windows.win_hostname:
        name: ws
      register: hostname_result
    - name: Reboot to apply the member hostname
      ansible.windows.win_reboot:
        reboot_timeout: 600
        post_reboot_delay: 30
      when: hostname_result.reboot_required
